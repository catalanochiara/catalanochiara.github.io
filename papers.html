<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recommended papers — Chiara Catalano</title>
<meta name="description" content="Papers read and recommended by Chiara Catalano.">
<link rel="preconnect" href="https://fonts.bunny.net">
<link href="https://fonts.bunny.net/css?family=lora:400i,500i,600i&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1c3540;
    --muted: #4f6870;
    --line: #d6f0ee;
    --paper: #f7fbfb;   /* sfondo */
    --card: #ffffff;
    --green: #d6f0ee;   /* acqua chiaro */
    --green-dark: #2a9d8f; /* teal */
    --teal2: #3aa597;
    --accent: #1f4e5f;  /* petrolio */
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --italic: "Lora", Georgia, serif;
    --sans: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--serif);
    font-size: 18px;
    line-height: 1.7;
  }
  a { color: var(--green-dark); text-decoration: none; border-bottom: 1px solid transparent; }
  a:hover { color: var(--accent); border-bottom-color: var(--accent); }

  .wrap {
    max-width: 1040px;
    margin: 0 auto;
    padding: 64px 32px;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 64px;
  }

  /* Colonna laterale */
  aside { position: sticky; top: 48px; align-self: start; }
  .avatar {
    width: 140px; height: 140px; border-radius: 50%;
    background: var(--green); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
    font-size: 48px; letter-spacing: 1px;
    border: 3px solid var(--card);
    box-shadow: 0 0 0 1px var(--green-dark);
    margin-bottom: 24px;
  }
  .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  h1 { font-size: 30px; line-height: 1.2; margin: 0 0 6px; font-weight: 600; }
  .role { color: var(--muted); font-size: 16px; margin: 0 0 20px; }
  .links { list-style: none; padding: 0; margin: 0 0 28px; font-family: var(--sans); font-size: 14px; }
  .links li { margin: 6px 0; }
  nav { font-family: var(--sans); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; border-top: 2px solid var(--green); padding-top: 18px; }
  nav a { display: block; color: var(--muted); padding: 4px 0; }
  nav a:hover { color: var(--accent); border-bottom-color: transparent; }

  /* Contenuto */
  section { margin-bottom: 56px; }
  h2 {
    font-size: 14px; font-family: var(--sans); font-weight: 600;
    text-transform: uppercase; letter-spacing: .12em; color: var(--green-dark);
    margin: 0 0 18px; padding-bottom: 8px; border-bottom: 2px solid var(--green);
  }
  .lead { font-size: 21px; line-height: 1.55; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; list-style: none; font-family: var(--sans); font-size: 14px; }
  .tags li { border: 1px solid var(--teal2); background: var(--green); color: var(--accent); padding: 4px 12px; border-radius: 999px; }

  .entry { display: grid; grid-template-columns: 110px 1fr; gap: 20px; margin-bottom: 18px; }
  .when { font-family: var(--sans); font-size: 14px; color: var(--green-dark); font-weight: 600; padding-top: 3px; }
  .entry strong { font-weight: 600; }
  .entry p { margin: 2px 0 0; color: var(--muted); font-size: 16px; }

  .pubs { padding-left: 1.2em; margin: 0; }
  .pubs li { margin-bottom: 14px; }
  .pubs .title { font-style: italic; }
  .pubs .venue { color: var(--muted); }
  .badge { font-family: var(--sans); font-size: 12px; background: var(--card); border: 1px solid var(--green-dark); padding: 1px 8px; border-radius: 4px; margin-left: 6px; white-space: nowrap; }

  footer { font-family: var(--sans); font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 18px; }

  @media (max-width: 800px) {
    .wrap { grid-template-columns: 1fr; gap: 32px; padding: 40px 22px; }
    aside { position: static; text-align: center; }
    .avatar { margin: 0 auto 20px; }
    .links { display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 18px; }
    nav { display: none; }
    .entry { grid-template-columns: 1fr; gap: 0; }
  }
  .skills { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  .skills h3 { font-size: 17px; margin: 0 0 8px; color: var(--accent); font-weight: 600; }
  .skills ul { margin: 0; padding-left: 1.1em; font-size: 16px; }
  .skills li { margin-bottom: 4px; }
  .when { line-height: 1.4; }
  @media (max-width: 800px) { .skills { grid-template-columns: 1fr; } }
  .langs { list-style: none; padding: 0 !important; }
  .langs li { display: grid; grid-template-columns: 90px auto 1fr; align-items: center; gap: 12px; margin-bottom: 8px !important; }
  .dots { display: inline-flex; gap: 5px; }
  .dots i { width: 11px; height: 11px; border-radius: 50%; background: var(--green); border: 1px solid var(--teal2); }
  .dots i.on { background: var(--green-dark); border-color: var(--green-dark); }
  .lvl { font-family: var(--sans); font-size: 13px; color: var(--muted); }
  .scale { font-family: var(--sans); font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  .reading { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  .reading h3 { font-size: 17px; margin: 0 0 10px; color: var(--accent); font-weight: 600; }
  .books { list-style: none; padding: 0; margin: 0; }
  .books li { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--teal2); border-radius: 6px; padding: 10px 14px; margin-bottom: 10px; position: relative; }
  .books li.current { border-left-color: var(--accent); background: var(--green); }
  .books .book { display: block; font-style: italic; line-height: 1.35; }
  .books .author { display: block; font-family: var(--sans); font-size: 13px; color: var(--muted); }
  .cover { position: relative; flex: 0 0 44px; width: 44px; height: 66px; cursor: zoom-in; outline: none; }
  .cover img { position: absolute; left: 0; top: 0; width: 44px; height: 66px; object-fit: cover; border-radius: 3px;
    box-shadow: 0 1px 3px rgba(31,78,95,.25); transform-origin: left center;
    transition: transform .25s ease, box-shadow .25s ease; z-index: 1; }
  .cover:hover img, .cover:focus img { transform: scale(3.6); box-shadow: 0 10px 30px rgba(31,78,95,.35); z-index: 20; }
  .cover:hover, .cover:focus { z-index: 20; }
  .books li:has(.cover:hover), .books li:has(.cover:focus) { z-index: 20; }
  .cover.nocover { cursor: default; background: var(--green); border: 1px solid var(--teal2); border-radius: 3px;
    display: flex; align-items: center; justify-content: center; }
  .cover.nocover::after { content: "📖"; font-size: 20px; }
  .cover.nocover img { display: none; }
  @media (max-width: 800px) { .reading { grid-template-columns: 1fr; } }
  .paperlist { list-style: none; padding: 0; margin: 0; }
  .paper { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--teal2); border-radius: 6px; padding: 12px 16px; margin-bottom: 10px; }
  .paper.current { border-left-color: var(--accent); background: var(--green); }
  .ptag { display: inline-block; font-family: var(--sans); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin-bottom: 4px; }
  .paper:not(.current) .ptag { color: var(--green-dark); }
  .ptitle { display: block; font-weight: 600; line-height: 1.4; }
  .pmeta { display: block; font-family: var(--sans); font-size: 13px; color: var(--muted); margin: 2px 0 8px; }
  .paper .badge { margin-left: 0; }
  .morelink { display: inline-block; font-family: var(--sans); font-size: 14px; font-weight: 600; margin-top: 4px; }
  .subhead { height: 22px; }
  .reading { grid-template-columns: 1fr !important; max-width: 460px; }
  em, i, .books .book, .pubs .title { font-family: var(--italic); font-style: italic; }
</style>
<style>
  .single { max-width: 760px; margin: 0 auto; padding: 64px 32px; }
  .back { font-family: var(--sans); font-size: 14px; font-weight: 600; display: inline-block; margin-bottom: 28px; }
  .single h1 { margin-bottom: 4px; }
  .intro { color: var(--muted); margin: 0 0 36px; }
  @media (max-width: 800px) { .single { padding: 40px 22px; } }
</style>
</head>
<body>
<div class="single">
  <a class="back" href="index.html">← Back to Chiara Catalano</a>
  <h1>Recommended papers</h1>
  <p class="intro">Papers I am reading and papers I recommend on language, pragmatics, humor and cognition.</p>
  <ul class="paperlist" id="paper-all"></ul>
  <footer>© 2026 Chiara Catalano</footer>
</div>
<script src="papers.js?v=4"></script>
<script>
  (function () {
    var box = document.getElementById('paper-all');
    var data = window.PAPERS || [];
    if (!box || !data.length) return;
    function esc(t) {
      return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
      });
    }
    function item(p, extra) {
      return '<li class="paper' + (p.current ? ' current' : '') + (extra ? ' ' + extra : '') + '">' +
        '<span class="ptag">' + (p.current ? 'Currently reading' : 'Recommended') + '</span>' +
        '<span class="ptitle">' + esc(p.title) + '</span>' +
        '<span class="pmeta">' + esc(p.authors) + ' · <em>' + esc(p.journal) + '</em>' +
          (p.details ? ', ' + esc(p.details) : '') + (p.year ? ' (' + esc(p.year) + ')' : '') + '</span>' +
        (p.link ? '<a class="badge" href="' + esc(p.link) + '" target="_blank" rel="noopener">Read the paper</a>' : '') +
        '</li>';
    }
    box.innerHTML = data.map(function (p) { return item(p, ''); }).join('');
  })();
</script>
</body>
</html>
